<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
    body { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
    button {
        width: 100%; height: 36px; border-radius: 12px; cursor: pointer;
        font: 600 0.8rem 'Plus Jakarta Sans', -apple-system, sans-serif;
        color: #fff; border: none;
        background: linear-gradient(120deg, #fa7e1e 0%, #d62976 55%, #962fbf 100%);
        box-shadow: 0 4px 14px rgba(214, 41, 118, 0.3);
        transition: transform 0.15s ease, filter 0.2s ease;
    }
    button:hover { transform: translateY(-1px); filter: brightness(1.1); }
    button:active { transform: translateY(0); }
    .msg { color: #ff8a80; font-size: 0.7rem; text-align: center; margin-top: 3px; }
</style>
</head>
<body>
<button id="btn">📋 Paste Link</button>
<div class="msg" id="msg"></div>
<script>
    function send(type, data) {
        window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
    }
    function setHeight() { send("streamlit:setFrameHeight", { height: document.body.scrollHeight }); }

    var btn = document.getElementById("btn");
    var msg = document.getElementById("msg");

    window.addEventListener("message", function (e) {
        if (e.data && e.data.type === "streamlit:render") {
            var label = e.data.args && e.data.args.label;
            if (label) btn.textContent = label;
            setHeight();
        }
    });

    btn.addEventListener("click", async function () {
        msg.textContent = "";
        try {
            var text = await navigator.clipboard.readText();
            if (!text || !text.trim()) {
                msg.textContent = "Clipboard is empty";
            } else {
                send("streamlit:setComponentValue", {
                    value: { text: text, nonce: Date.now() },
                    dataType: "json"
                });
            }
        } catch (err) {
            msg.textContent = "Allow clipboard access, or paste with Ctrl/⌘+V";
        }
        setHeight();
    });

    send("streamlit:componentReady", { apiVersion: 1 });
    setHeight();
</script>
</body>
</html>
